<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blinkit - Quick Commerce (SPM project)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <div class="brand">blink<span>it</span><small>SPM demo</small></div>
  <nav id="tabs">
    <button data-view="shop" class="on">Shop</button>
    <button data-view="track">Track order</button>
    <button data-view="store">Dark store</button>
    <button data-view="rider">Rider app</button>
    <button data-view="admin">Admin</button>
  </nav>
</header>

<main>
<!-- MODULE 1+3: Shop -->
<section id="view-shop" class="view">
  <div class="shop-grid">
    <div>
      <div class="toolbar">
        <label class="loc">Deliver to
          <select id="locality"></select>
        </label>
        <input id="search" type="search" placeholder="Search milk, atta, chips...">
        <select id="sort">
          <option value="relevance">Sort: Featured</option>
          <option value="price_asc">Price: low to high</option>
          <option value="price_desc">Price: high to low</option>
          <option value="discount">Biggest discount</option>
        </select>
      </div>
      <div id="loc-banner" class="banner"></div>
      <div id="chips" class="chips"></div>
      <div id="products" class="products"></div>
    </div>
    <aside class="cart" id="cart">
      <h2>Your cart</h2>
      <div id="cart-lines"></div>
      <div id="bill"></div>
      <div class="promo">
        <input id="promo" placeholder="Promo code">
        <button id="apply-promo" class="ghost">Apply</button>
      </div>
      <div id="promo-msg" class="hint"></div>
      <div id="promo-list" class="hint"></div>
      <form id="checkout" onsubmit="return false">
        <input id="c-name" placeholder="Full name" autocomplete="name">
        <input id="c-phone" placeholder="10-digit phone" inputmode="numeric" maxlength="10">
        <input id="c-address" placeholder="Flat / house, street">
        <select id="c-pay"><option>UPI</option><option>Card</option><option>Cash on delivery</option></select>
        <button id="place" class="primary">Place order</button>
        <div id="place-msg" class="hint err"></div>
      </form>
    </aside>
  </div>
</section>

<!-- MODULE 4: Tracking -->
<section id="view-track" class="view" hidden>
  <div class="panel narrow">
    <div class="row">
      <input id="track-id" placeholder="Order number, e.g. 1">
      <button id="track-go" class="primary">Track</button>
    </div>
    <div id="track-body"><p class="hint">Place an order from the Shop tab, or enter an order number.</p></div>
  </div>
</section>

<!-- MODULE 2: Dark store -->
<section id="view-store" class="view" hidden>
  <div class="panel">
    <div class="row"><h2>Dark store console</h2>
      <select id="store-select"></select></div>
    <div class="two">
      <div><h3>Orders to pack</h3><div id="store-orders"></div></div>
      <div><h3>Inventory <span class="hint">(low stock first)</span></h3><div id="store-inv" class="scroll"></div></div>
    </div>
  </div>
</section>

<!-- MODULE 5: Rider -->
<section id="view-rider" class="view" hidden>
  <div class="panel narrow">
    <div class="row"><h2>Rider app</h2><select id="rider-select"></select></div>
    <div id="rider-body"></div>
  </div>
</section>

<!-- MODULE 6: Admin -->
<section id="view-admin" class="view" hidden>
  <div class="panel">
    <div class="row"><h2>Operations dashboard</h2>
      <button id="reset" class="ghost">Reset demo data</button></div>
    <div id="admin-body"></div>
  </div>
</section>
</main>
<div id="toast" class="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
